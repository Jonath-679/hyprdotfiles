# Font
font_family Noto Sans Mono
font_size 11

# General
cursor_shape underline
cursor_blink_interval 0.250
cursor_stop_blinking_after 0
shell_integration no-cursor
scrollback_indicator_opacity 0

# keybinds (so they don't interfere with some nvim shortcuts)
map ctrl+shift+t no_op
map ctrl+t new_tab

# Catppuccin Mocha + acent #a9b1d6
foreground #a9b1d6
background #1e1e2e
cursor #a9b1d6
cursor_text_color #1e1e2e
selection_foreground #1e1e2e
selection_background #a9b1d6
url_color #74c7ec

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8
